<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealthCoach CUJ — Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root {
    --teal-50:#F0FDF9;--teal-100:#CCFBF0;--teal-500:#0E9F8C;--teal-600:#0A7A6E;--teal-700:#0A6259;
    --neutral-50:#FAFAF9;--neutral-100:#F5F5F4;--neutral-200:#E7E5E4;--neutral-300:#D6D3D1;
    --neutral-400:#A8A29E;--neutral-500:#78716C;--neutral-600:#57534E;--neutral-800:#292524;
    --font-body:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    --font-serif:'Lora',Georgia,serif;
  }
  html{font-size:15px;scroll-behavior:smooth}
  body{font-family:var(--font-body);background:var(--neutral-50);color:var(--neutral-800);
    line-height:1.6;min-height:100vh}

  .page-header{position:sticky;top:0;z-index:100;
    background:rgba(250,250,249,0.88);backdrop-filter:blur(20px) saturate(1.6);
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    border-bottom:1px solid var(--neutral-200);padding:1rem 2rem;
    display:flex;align-items:center;gap:1rem}
  .page-header h1{font-family:var(--font-serif);font-size:1.3rem;font-weight:700;
    color:var(--teal-700);letter-spacing:-0.01em}
  .page-header .badge{font-size:0.68rem;font-weight:700;letter-spacing:0.06em;
    text-transform:uppercase;padding:0.2em 0.6em;border-radius:999px;
    background:var(--teal-100);color:var(--teal-700)}
  .page-header .back-link{margin-left:auto;font-size:0.82rem;font-weight:600;
    color:var(--teal-600);text-decoration:none;display:flex;align-items:center;gap:0.35rem;
    transition:color 0.2s}
  .page-header .back-link:hover{color:var(--teal-700)}

  .container{max-width:800px;margin:0 auto;padding:2.5rem 2rem 4rem}

  .overview-card{background:#fff;border-radius:14px;border:1px solid var(--neutral-200);
    box-shadow:0 2px 8px rgba(0,0,0,0.04);padding:2rem;overflow:hidden}
  .overview-card svg,.overview-card object,.overview-card img{width:100%;height:auto;display:block;
    transform-origin:top left;transition:transform 0.2s ease}

  .controls{display:flex;align-items:center;gap:0.75rem;margin-bottom:1.25rem;
    flex-wrap:wrap}
  .controls button{font-family:var(--font-body);font-size:0.78rem;font-weight:600;
    padding:0.4rem 0.9rem;border-radius:999px;border:1.5px solid var(--neutral-200);
    background:#fff;color:var(--neutral-600);cursor:pointer;transition:all 0.2s}
  .controls button:hover{border-color:var(--teal-400);color:var(--teal-700);
    background:var(--teal-50)}
  .controls button.active{border-color:var(--teal-500);background:var(--teal-500);color:#fff}
  .zoom-label{font-size:0.75rem;color:var(--neutral-500);font-weight:500;margin-left:auto}

  .page-footer{text-align:center;padding:2rem;color:var(--neutral-400);
    font-size:0.72rem;font-weight:500}

  @media(max-width:700px){
    .page-header{padding:0.75rem 1rem}
    .container{padding:1.5rem 1rem 3rem}
    .overview-card{padding:1rem}
  }
  @media print{
    .page-header{position:static;backdrop-filter:none}
    .controls{display:none}
  }
</style>
</head>
<body>

<header class="page-header">
  <h1>CUJ Overview</h1>
  <span class="badge">Draft v0.1</span>
  <a class="back-link" href="index.html">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 12L6 8l4-4"/></svg>
    All diagrams
  </a>
</header>

<div class="container">

  <div class="controls">
    <button class="zoom-btn" data-zoom="0.75">75%</button>
    <button class="zoom-btn active" data-zoom="1">100%</button>
    <button class="zoom-btn" data-zoom="1.25">125%</button>
    <button class="zoom-btn" data-zoom="1.5">150%</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
  </div>

  <div class="overview-card" id="svgContainer">
    <object id="svgObject" type="image/svg+xml" data="cuj-overview.svg" aria-label="HealthCoach CUJ overview diagram">
      <img src="cuj-overview.svg" alt="HealthCoach CUJ overview diagram">
    </object>
  </div>

</div>

<footer class="page-footer">
  HealthCoach CUJ Overview -- Draft v0.1 -- Derived from CUJ working sessions (Adam, Sigal, Betsy, Chase, Eric, Ria)
</footer>

<script src="gate.js"></script>
<script>
  const obj = document.getElementById('svgObject');
  const container = document.getElementById('svgContainer');
  const btns = document.querySelectorAll('.zoom-btn');
  const label = document.getElementById('zoomLabel');

  function getTarget() {
    try {
      const innerSvg = obj.contentDocument && obj.contentDocument.querySelector('svg');
      if (innerSvg) return innerSvg;
    } catch (e) { /* fall back to object element */ }
    return obj;
  }

  btns.forEach(btn => {
    btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const z = parseFloat(btn.dataset.zoom);
      const target = getTarget();
      target.style.transform = `scale(${z})`;
      target.style.transformOrigin = 'top left';
      container.style.overflow = z > 1 ? 'auto' : 'hidden';
      if (target === obj) {
        obj.style.width = (100 * z) + '%';
      }
      label.textContent = Math.round(z * 100) + '%';
    });
  });
</script>
</body>
</html>
